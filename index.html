<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Banderillero Satelital Agrícola Pro</title>
  
  <!-- Manifest integrado para PWA / APK -->
  <link rel="manifest" href="data:application/manifest+json;charset=utf-8,{
    %22name%22: %22Banderillero Agrícola Pro%22,
    %22short_name%22: %22Banderillero%22,
    %22start_url%22: %22./index.html%22,
    %22display%22: %22standalone%22,
    %22background_color%22: %22%23030712%22,
    %22theme_color%22: %22%23030712%22,
    %22icons%22: [{
      %22src%22: %22https://cdn-icons-png.flaticon.com/512/2821/2821794.png%22,
      %22sizes%22: %22512x512%22,
      %22type%22: %22image/png%22
    }]
  }">

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      touch-action: none;
      overflow: hidden;
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      touch-action: none;
    }
  </style>
</head>
<body class="bg-gray-950 text-white select-none h-screen w-screen flex flex-col font-sans overflow-hidden">

  <!-- ========================================== -->
  <!-- BLOQUE VISUAL Y DE INTERFAZ (UI & HUD)     -->
  <!-- ========================================== -->
  <header class="bg-gray-900 border-b border-gray-800 p-2 flex flex-col gap-1.5 shrink-0 shadow-lg z-20">
    <div class="flex justify-between items-center">
      <div class="flex items-center gap-1.5">
        <span class="text-xs font-black text-green-400 tracking-wide">🌾 Banderillero Pro</span>
        <div id="gps-status" class="px-2 py-0.5 text-[10px] rounded-full bg-blue-600 text-white font-bold flex items-center gap-1">
          <span>Simulador</span>
        </div>
      </div>
      <!-- Botones de Modo -->
      <div class="flex gap-1">
        <button id="btn-mode-sim" onclick="setMode('sim')" class="px-2 py-1 text-[10px] font-bold rounded bg-blue-600 shadow">Sim.</button>
        <button id="btn-mode-gps" onclick="setMode('gps')" class="px-2 py-1 text-[10px] font-bold rounded bg-gray-800 text-gray-300">GPS Int.</button>
        <button id="btn-mode-tcp" onclick="setMode('tcp')" class="px-2 py-1 text-[10px] font-bold rounded bg-gray-800 text-gray-300">Visor TCP</button>
      </div>
    </div>

    <!-- Panel de Visor de Mensajes del Puerto 8888 -->
    <div id="tcp-panel" class="hidden flex flex-col gap-1 bg-black p-2 rounded border border-gray-800 text-[11px] font-mono">
      <div class="flex justify-between items-center border-b border-gray-800 pb-1">
        <span class="text-green-400 font-bold">📡 Monitor Puerto 8888 (TCP NMEA)</span>
        <div class="flex gap-1">
          <button onclick="toggleStreamSimulation()" id="btn-stream" class="px-2 py-0.5 bg-green-600 font-bold rounded text-[10px]">Simular Stream</button>
          <button onclick="clearConsole()" class="px-1.5 py-0.5 bg-gray-800 text-gray-300 rounded text-[10px]">Limpiar</button>
        </div>
      </div>
      <div id="nmea-console" class="h-16 overflow-y-auto text-gray-300 flex flex-col gap-0.5 text-[10px]">
        <div class="text-gray-500">// Esperando tramas $GNGGA, $GNRMC, $GNVTG, $GNGLL...</div>
      </div>
    </div>

    <!-- Lightbar LED (Indicador XTE / Desvío Lateral) -->
    <div class="flex items-center justify-center gap-1 bg-black p-1 rounded border border-gray-800 shadow-inner">
      <span class="text-[9px] font-bold text-gray-400 mr-1">IZQ</span>
      <div id="lightbar" class="flex gap-1"></div>
      <span class="text-[9px] font-bold text-gray-400 ml-1">DER</span>
    </div>
  </header>

  <!-- Panel Principal: Canvas + Controles Flotantes -->
  <div class="relative flex-1 bg-black overflow-hidden">
    <canvas id="mapCanvas" class="w-full h-full block cursor-crosshair"></canvas>

    <!-- Controles de Zoom -->
    <div class="absolute top-3 right-3 flex flex-col gap-2 z-10">
      <button onclick="zoomIn()" class="w-10 h-10 bg-gray-900/90 active:bg-gray-700 border border-gray-700 rounded-full flex items-center justify-center text-xl font-bold shadow-xl text-white">+</button>
      <button onclick="zoomOut()" class="w-10 h-10 bg-gray-900/90 active:bg-gray-700 border border-gray-700 rounded-full flex items-center justify-center text-xl font-bold shadow-xl text-white">-</button>
    </div>

    <!-- Panel A-B y Ancho -->
    <div class="absolute top-3 left-3 flex flex-col gap-2 z-10 w-52">
      <div class="bg-gray-900/90 backdrop-blur border border-gray-800 p-2 rounded-xl flex gap-1.5 shadow-xl">
        <button id="btn-pointA" onclick="setPointA()" class="flex-1 py-1.5 bg-green-600 hover:bg-green-500 active:bg-green-700 font-bold text-xs rounded shadow text-white">Punto A</button>
        <button id="btn-pointB" onclick="setPointB()" class="flex-1 py-1.5 bg-red-600 hover:bg-red-500 active:bg-red-700 font-bold text-xs rounded shadow text-white">Punto B</button>
        <button onclick="clearAB()" class="px-2 py-1.5 bg-gray-800 hover:bg-gray-700 text-xs rounded font-bold text-gray-300">Limpiar</button>
      </div>

      <div class="bg-gray-900/90 backdrop-blur border border-gray-800 p-2 rounded-xl flex flex-col gap-1.5 shadow-xl">
        <div class="flex items-center justify-between">
          <label class="text-[11px] text-gray-300 font-medium">Ancho Labor (m):</label>
          <input type="number" id="input-width" value="12.0" step="0.5" min="1" class="w-14 bg-gray-800 border border-gray-700 text-center text-xs p-1 rounded font-bold text-white" onchange="updateWidth(this.value)">
        </div>
        <button id="btn-paint" onclick="togglePaint()" class="w-full py-1 bg-green-600 hover:bg-green-500 font-bold text-xs rounded shadow text-white transition-colors">
          Pintar: ON
        </button>
      </div>
    </div>

    <!-- Métricas (Abajo) -->
    <div class="absolute bottom-3 left-3 right-3 bg-gray-900/90 backdrop-blur border border-gray-800 p-2.5 rounded-2xl flex justify-around text-center z-10 shadow-2xl">
      <div>
        <div class="text-[9px] text-gray-400 font-bold uppercase">Velocidad</div>
        <div class="text-xl font-black text-yellow-400"><span id="val-speed">0.0</span> <span class="text-[10px]">km/h</span></div>
      </div>
      <div class="border-l border-gray-800 pl-2">
        <div class="text-[9px] text-gray-400 font-bold uppercase">Desvío (XTE)</div>
        <div class="text-xl font-black text-green-400"><span id="val-xte">0.00</span> <span class="text-[10px]">m</span></div>
      </div>
      <div class="border-l border-gray-800 pl-2">
        <div class="text-[9px] text-gray-400 font-bold uppercase">Superficie</div>
        <div class="text-xl font-black text-cyan-400"><span id="val-area">0.00</span> <span class="text-[10px]">ha</span></div>
      </div>
      <div class="border-l border-gray-800 pl-2">
        <div class="text-[9px] text-gray-400 font-bold uppercase">Pasada</div>
        <div class="text-xl font-black text-purple-400"><span id="val-pass">0</span></div>
      </div>
    </div>

    <!-- Controles Simulador -->
    <div id="sim-controls" class="absolute bottom-20 right-3 bg-gray-900/90 backdrop-blur border border-gray-800 p-2.5 rounded-2xl flex flex-col gap-1.5 z-10 w-44 shadow-2xl">
      <div class="text-[11px] font-bold text-gray-400 border-b border-gray-800 pb-0.5">Controles Simulador</div>
      <div class="flex items-center justify-between text-[11px]">
        <span>Acelerar:</span>
        <input type="range" id="sim-speed" min="0" max="30" value="10" class="w-20 accent-blue-500" oninput="simSpeed = parseFloat(this.value)">
      </div>
      <div class="flex items-center justify-between text-[11px]">
        <span>Volante:</span>
        <input type="range" id="sim-steer" min="-45" max="45" value="0" class="w-20 accent-blue-500" oninput="simSteer = parseFloat(this.value)">
      </div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- BLOQUE DE LÓGICA Y COMUNICACIÓN (JS CORE)  -->
  <!-- ========================================== -->
  <script>
    // Registro automático del Service Worker para cumplimiento PWA / APK
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swCode = `self.addEventListener('fetch', (e) => { e.respondWith(fetch(e.request).catch(() => caches.match(e.request))); });`;
        const blob = new Blob([swCode], { type: 'text/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
      });
    }

    let mode = 'sim';
    let zoomLevel = 3.0;
    let isPainting = true;

    let posX = 0, posY = 0; 
    let heading = 0; 
    let speedKmH = 0;
    let gpsAccuracy = 0.02;
    let gpsSats = 18;

    let originLat = null, originLon = null;
    let watchId = null;
    let streamInterval = null;

    let implementWidth = 12.0; 
    let implementOffset = 3.0; 
    let pointA = null, pointB = null;
    let abHeading = null; 

    let swaths = []; 
    let lastBoomBar = null; 
    let totalAreaM2 = 0;

    let simSpeed = 10;
    let simSteer = 0;

    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');

    function init() {
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
      buildLightbar();
      setupTouchControls();
      requestAnimationFrame(gameLoop);
    }

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }

    function zoomIn() { zoomLevel = Math.min(zoomLevel * 1.25, 15.0); }
    function zoomOut() { zoomLevel = Math.max(zoomLevel / 1.25, 0.5); }
    function updateWidth(val) { implementWidth = parseFloat(val) || 12.0; }

    function togglePaint() {
      isPainting = !isPainting;
      const btn = document.getElementById('btn-paint');
      if (isPainting) {
        btn.className = 'w-full py-1 bg-green-600 hover:bg-green-500 font-bold text-xs rounded shadow text-white transition-colors';
        btn.innerText = 'Pintar: ON';
      } else {
        btn.className = 'w-full py-1 bg-red-600 hover:bg-red-500 font-bold text-xs rounded shadow text-white transition-colors';
        btn.innerText = 'Pintar: OFF';
        lastBoomBar = null;
      }
    }

    function setupTouchControls() {
      let lastTouchDist = 0;
      document.addEventListener('touchmove', (e) => {
        if (e.touches.length > 1) e.preventDefault();
      }, { passive: false });

      canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          lastTouchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        }
      }, { passive: false });

      canvas.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2) {
          e.preventDefault();
          const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
          const delta = dist - lastTouchDist;
          if (Math.abs(delta) > 5) {
            if (delta > 0) zoomIn(); else zoomOut();
            lastTouchDist = dist;
          }
        }
      }, { passive: false });

      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        if (e.deltaY < 0) zoomIn(); else zoomOut();
      }, { passive: false });
    }

    function buildLightbar() {
      const container = document.getElementById('lightbar');
      container.innerHTML = '';
      for (let i = -8; i <= 8; i++) {
        const led = document.createElement('div');
        led.id = `led-${i}`;
        led.className = 'w-2 h-4 rounded-sm bg-gray-900 border border-gray-800 transition-colors duration-75';
        container.appendChild(led);
      }
    }

    function updateLightbar(xte) {
      const thresholdStep = 0.15; 
      for (let i = -8; i <= 8; i++) {
        const led = document.getElementById(`led-${i}`);
        if (!led) continue;
        
        if (i === 0) {
          led.className = Math.abs(xte) < 0.1 ? 'w-2 h-4 rounded-sm bg-green-500 shadow-lg shadow-green-500/50' : 'w-2 h-4 rounded-sm bg-gray-900';
        } else if (i < 0 && xte < -Math.abs(i) * thresholdStep) {
          led.className = 'w-2 h-4 rounded-sm bg-red-500 shadow-lg shadow-red-500/50';
        } else if (i > 0 && xte > i * thresholdStep) {
          led.className = 'w-2 h-4 rounded-sm bg-red-500 shadow-lg shadow-red-500/50';
        } else {
          led.className = 'w-2 h-4 rounded-sm bg-gray-900';
        }
      }
    }

    function setPointA() { pointA = { x: posX, y: posY }; if (pointB) calculateAB(); }
    function setPointB() { pointB = { x: posX, y: posY }; if (pointA) calculateAB(); }
    function clearAB() { pointA = null; pointB = null; abHeading = null; }

    function calculateAB() {
      const dx = pointB.x - pointA.x;
      const dy = pointB.y - pointA.y;
      // Dirección del vector A-B exacto
      abHeading = Math.atan2(dx, dy); 
    }

    let lastTime = performance.now();

    function gameLoop(now) {
      const dt = (now - lastTime) / 1000;
      lastTime = now;

      updatePhysics(dt);
      renderMap();

      requestAnimationFrame(gameLoop);
    }

    function updatePhysics(dt) {
      if (mode === 'sim') {
        speedKmH = simSpeed;
        heading += (simSteer * (speedKmH / 10)) * dt;
        
        const speedMS = speedKmH / 3.6;
        const radHeading = heading * Math.PI / 180;
        posX += Math.sin(radHeading) * speedMS * dt;
        posY += Math.cos(radHeading) * speedMS * dt;
      }

      const radHeading = heading * Math.PI / 180;
      const implX = posX - Math.sin(radHeading) * implementOffset;
      const implY = posY - Math.cos(radHeading) * implementOffset;

      const perpX = Math.cos(radHeading) * (implementWidth / 2);
      const perpY = -Math.sin(radHeading) * (implementWidth / 2);

      const currentBoomBar = {
        left:  { x: implX - perpX, y: implY - perpY },
        right: { x: implX + perpX, y: implY + perpY },
        center: { x: implX, y: implY }
      };

      if (isPainting && speedKmH > 0.5) {
        if (lastBoomBar) {
          const dist = Math.hypot(implX - lastBoomBar.center.x, implY - lastBoomBar.center.y);

          if (dist >= 0.2) {
            const swath = [
              lastBoomBar.left,
              lastBoomBar.right,
              currentBoomBar.right,
              currentBoomBar.left
            ];

            swaths.push(swath);
            totalAreaM2 += dist * implementWidth;
            lastBoomBar = currentBoomBar;
          }
        } else {
          lastBoomBar = currentBoomBar;
        }
      } else {
        lastBoomBar = null;
      }

      let xte = 0;
      let currentPass = 0;

      if (pointA && abHeading !== null) {
        // Cálculo del desvío lateral (XTE) perfectamente perpendicular a la línea A-B
        const dx = posX - pointA.x;
        const dy = posY - pointA.y;
        const perpDist = dx * Math.cos(abHeading) - dy * Math.sin(abHeading);
        
        currentPass = Math.round(perpDist / implementWidth);
        xte = perpDist - (currentPass * implementWidth);
      }

      document.getElementById('val-speed').innerText = speedKmH.toFixed(1);
      document.getElementById('val-xte').innerText = Math.abs(xte).toFixed(2);
      document.getElementById('val-area').innerText = (totalAreaM2 / 10000).toFixed(2);
      document.getElementById('val-pass').innerText = currentPass;

      updateLightbar(xte);
      updateGPSStatusUI();
    }

    function updateGPSStatusUI() {
      const statusDiv = document.getElementById('gps-status');
      if (mode === 'sim') {
        statusDiv.className = 'px-2 py-0.5 text-[10px] rounded-full bg-blue-600 text-white font-bold flex items-center gap-1';
        statusDiv.innerHTML = `<span>Simulador</span>`;
      } else if (mode === 'tcp') {
        statusDiv.className = 'px-2 py-0.5 text-[10px] rounded-full bg-yellow-600 text-white font-bold flex items-center gap-1';
        statusDiv.innerHTML = `<span>Visor TCP (🛰️ ${gpsSats})</span>`;
      } else {
        statusDiv.className = 'px-2 py-0.5 text-[10px] rounded-full bg-green-600 text-white font-bold flex items-center gap-1';
        statusDiv.innerHTML = `<span>GPS Int.</span>`;
      }
    }

    function renderMap() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;

      ctx.translate(centerX, centerY);
      ctx.scale(zoomLevel, -zoomLevel);
      ctx.translate(-posX, -posY);

      drawGrid();
      drawSwaths();

      if (pointA && abHeading !== null) {
        drawABLines();
      }

      drawTractorAndImplement();

      ctx.restore();
    }

    function drawGrid() {
      ctx.strokeStyle = '#111827';
      ctx.lineWidth = 1 / zoomLevel;
      const gridSize = 50;

      const minX = posX - (canvas.width / (2 * zoomLevel));
      const maxX = posX + (canvas.width / (2 * zoomLevel));
      const minY = posY - (canvas.height / (2 * zoomLevel));
      const maxY = posY + (canvas.height / (2 * zoomLevel));

      const startX = Math.floor(minX / gridSize) * gridSize;
      const startY = Math.floor(minY / gridSize) * gridSize;

      ctx.beginPath();
      for (let x = startX; x < maxX; x += gridSize) {
        ctx.moveTo(x, minY); ctx.lineTo(x, maxY);
      }
      for (let y = startY; y < maxY; y += gridSize) {
        ctx.moveTo(minX, y); ctx.lineTo(maxX, y);
      }
      ctx.stroke();
    }

    function drawSwaths() {
      if (swaths.length === 0) return;

      ctx.fillStyle = 'rgba(34, 197, 94, 0.5)'; 
      for (let i = 0; i < swaths.length; i++) {
        const poly = swaths[i];
        ctx.beginPath();
        ctx.moveTo(poly[0].x, poly[0].y);
        ctx.lineTo(poly[1].x, poly[1].y);
        ctx.lineTo(poly[2].x, poly[2].y);
        ctx.lineTo(poly[3].x, poly[3].y);
        ctx.closePath();
        ctx.fill();
      }
    }

    function drawABLines() {
      if (!pointA || abHeading === null) return;
      const lineLength = 50000; 
      ctx.lineWidth = 1.5 / zoomLevel;

      const dx = posX - pointA.x;
      const dy = posY - pointA.y;
      const perpDist = dx * Math.cos(abHeading) - dy * Math.sin(abHeading);
      const activePassIndex = Math.round(perpDist / implementWidth);

      // --- SOLUCIÓN: Rango dinámico basado en la pasada actual ---
      // Dibuja 25 pasadas hacia la izquierda y 25 hacia la derecha de donde estás ahora mismo
      const minPass = activePassIndex - 25;
      const maxPass = activePassIndex + 25;

      for (let i = minPass; i <= maxPass; i++) {
        const offset = i * implementWidth;
        
        const offsetX = Math.cos(abHeading) * offset;
        const offsetY = -Math.sin(abHeading) * offset;

        const startX = pointA.x + offsetX - Math.sin(abHeading) * lineLength;
        const startY = pointA.y + offsetY - Math.cos(abHeading) * lineLength;
        const endX   = pointA.x + offsetX + Math.sin(abHeading) * lineLength;
        const endY   = pointA.y + offsetY + Math.cos(abHeading) * lineLength;

        if (i === activePassIndex) {
          ctx.strokeStyle = '#facc15'; 
          ctx.lineWidth = 3.5 / zoomLevel;
          ctx.shadowColor = '#facc15';
          ctx.shadowBlur = 8;
        } else {
          ctx.strokeStyle = (i === 0) ? '#38bdf8' : 'rgba(255, 255, 255, 0.25)';
          ctx.lineWidth = 1.5 / zoomLevel;
          ctx.shadowBlur = 0;
        }

        if (i === 0) ctx.setLineDash([6 / zoomLevel, 6 / zoomLevel]);
        else ctx.setLineDash([]);

        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(endX, endY);
        ctx.stroke();
      }
      ctx.setLineDash([]);
      ctx.shadowBlur = 0;
    }

    function drawTractorAndImplement() {
      ctx.save();
      ctx.translate(posX, posY);
      ctx.rotate(-heading * Math.PI / 180);

      ctx.fillStyle = '#eab308';
      ctx.fillRect(-implementWidth / 2, -implementOffset - 0.4, implementWidth, 0.8);

      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 0.6;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -implementOffset);
      ctx.stroke();

      ctx.fillStyle = '#3b82f6';
      ctx.beginPath();
      ctx.moveTo(0, 3.2);
      ctx.lineTo(-1.6, -2);
      ctx.lineTo(1.6, -2);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#1d4ed8';
      ctx.fillRect(-1, -1, 2, 2);

      ctx.restore();
    }

    function setMode(m) {
      mode = m;
      if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; }
      if (streamInterval) { clearInterval(streamInterval); streamInterval = null; }

      document.getElementById('sim-controls').style.display = (m === 'sim') ? 'flex' : 'none';
      document.getElementById('tcp-panel').style.display = (m === 'tcp') ? 'flex' : 'none';
      
      document.getElementById('btn-mode-sim').className = (m === 'sim') ? 'px-2 py-1 text-[10px] font-bold rounded bg-blue-600 shadow' : 'px-2 py-1 text-[10px] font-bold rounded bg-gray-800 text-gray-300';
      document.getElementById('btn-mode-gps').className = (m === 'gps') ? 'px-2 py-1 text-[10px] font-bold rounded bg-blue-600 shadow' : 'px-2 py-1 text-[10px] font-bold rounded bg-gray-800 text-gray-300';
      document.getElementById('btn-mode-tcp').className = (m === 'tcp') ? 'px-2 py-1 text-[10px] font-bold rounded bg-blue-600 shadow' : 'px-2 py-1 text-[10px] font-bold rounded bg-gray-800 text-gray-300';

      if (m === 'gps') {
        startInternalGPS();
      }
    }

    function logNMEA(sentence) {
      const consoleBox = document.getElementById('nmea-console');
      const div = document.createElement('div');
      div.className = sentence.includes('GGA') ? 'text-green-400' : (sentence.includes('RMC') ? 'text-yellow-400' : 'text-cyan-400');
      div.textContent = `> ${sentence}`;
      consoleBox.appendChild(div);
      if (consoleBox.childNodes.length > 25) consoleBox.removeChild(consoleBox.firstChild);
      consoleBox.scrollTop = consoleBox.scrollHeight;

      parseNMEAString(sentence);
    }

    function clearConsole() {
      document.getElementById('nmea-console').innerHTML = '';
    }

    function toggleStreamSimulation() {
      const btn = document.getElementById('btn-stream');
      if (streamInterval) {
        clearInterval(streamInterval);
        streamInterval = null;
        btn.textContent = "Simular Stream";
        btn.className = "px-2 py-0.5 bg-green-600 font-bold rounded text-[10px]";
      } else {
        btn.textContent = "Detener Stream";
        btn.className = "px-2 py-0.5 bg-red-600 font-bold rounded text-[10px]";
        
        let step = 0;
        streamInterval = setInterval(() => {
          step += 0.0001;
          const gga = `$GNGGA,123519.00,1748.${Math.floor(3125 + step*100000)},S,06310.5412,W,1,16,0.7,300.2,M,47.0,M,,*47`;
          const rmc = `$GNRMC,123519.00,A,1748.${Math.floor(3125 + step*100000)},S,06310.5412,W,8.5,45.0,230326,,,A*66`;
          const vtg = `$GNVTG,45.0,T,,M,8.5,N,15.7,K,A*3B`;

          logNMEA(gga);
          logNMEA(rmc);
          logNMEA(vtg);
        }, 1000);
      }
    }

    function parseNMEAString(sentence) {
      const parts = sentence.split(',');
      const type = parts[0];

      if (type.includes('GGA')) {
        let rawLat = parts[2], latDir = parts[3];
        let rawLon = parts[4], lonDir = parts[5];
        if (rawLat && rawLon) {
          let lat = convertNMEACoord(rawLat, latDir);
          let lon = convertNMEACoord(rawLon, lonDir);
          gpsSats = parseInt(parts[7]) || 16;

          if (originLat === null) { originLat = lat; originLon = lon; }
          posX = (lon - originLon) * (111320 * Math.cos(lat * Math.PI / 180));
          posY = (lat - originLat) * 111320;
        }
      } else if (type.includes('RMC')) {
        let spdKnots = parseFloat(parts[7]) || 0;
        let trackDeg = parseFloat(parts[8]);
        speedKmH = spdKnots * 1.852;
        if (!isNaN(trackDeg)) { heading = trackDeg; }
      } else if (type.includes('VTG')) {
        let trackDeg = parseFloat(parts[1]);
        let spdKmhVal = parseFloat(parts[5]);
        if (!isNaN(trackDeg)) { heading = trackDeg; }
        if (!isNaN(spdKmhVal)) { speedKmH = spdKmhVal; }
      }
    }

    function convertNMEACoord(raw, dir) {
      let degrees = Math.floor(parseFloat(raw) / 100);
      let minutes = parseFloat(raw) - (degrees * 100);
      let dec = degrees + (minutes / 60);
      if (dir === 'S' || dir === 'W') dec *= -1;
      return dec;
    }

    function startInternalGPS() {
      if ('geolocation' in navigator) {
        watchId = navigator.geolocation.watchPosition((pos) => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          speedKmH = (pos.coords.speed || 0) * 3.6;
          gpsSats = 16;

          if (pos.coords.heading !== null && !isNaN(pos.coords.heading)) {
            heading = pos.coords.heading;
          }

          if (originLat === null) { originLat = lat; originLon = lon; }
          posX = (lon - originLon) * (111320 * Math.cos(lat * Math.PI / 180));
          posY = (lat - originLat) * 111320;

        }, (err) => {
          alert("Error de GPS interno: " + err.message);
        }, {
          enableHighAccuracy: true,
          maximumAge: 0
        });
      }
    }

    window.onload = init;
  </script>
