<!DOCTYPE html>
<html lang="es" class="h-full w-full overflow-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Banderillero Satelital Agrícola Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      touch-action: none;
      overflow: hidden;
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
    }
    /* Ocultar scrollbar pero mantener scroll en header */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    canvas {
      touch-action: none;
    }
  </style>
</head>
<body class="bg-gray-950 text-white select-none h-full w-full flex flex-col font-sans overflow-hidden">

  <!-- Header Superior Ultra Responsivo -->
  <header class="bg-gray-900 border-b border-gray-800 p-2 flex flex-col gap-1.5 shrink-0 shadow-lg z-20">
    <div class="flex items-center justify-between gap-2">
      <!-- Marca + Estado GPS -->
      <div class="flex items-center gap-1.5 shrink-0">
        <span class="text-sm sm:text-base font-black text-green-400 tracking-wide flex items-center gap-1">
          🌾 <span class="hidden xs:inline">Banderillero</span><span class="xs:hidden">GPS</span>
        </span>
        <div id="gps-status" class="px-2 py-0.5 text-[10px] sm:text-xs rounded-full bg-blue-600 text-white font-bold flex items-center gap-1">
          <span>Simulador</span>
        </div>
      </div>

      <!-- Selector de Modos (Scrollable Horizontal para Pantallas de 5") -->
      <div class="flex items-center gap-1 overflow-x-auto no-scrollbar py-0.5 max-w-[55%] sm:max-w-none">
        <button id="btn-mode-sim" onclick="setMode('sim')" class="shrink-0 px-2.5 py-1 text-[11px] font-bold rounded-lg bg-blue-600 hover:bg-blue-500 text-white shadow transition-all">Simulador</button>
        <button id="btn-mode-gps" onclick="setMode('gps')" class="shrink-0 px-2.5 py-1 text-[11px] font-bold rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-300 transition-all">GPS Interno</button>
        <button id="btn-mode-ext" onclick="setMode('ext')" class="shrink-0 px-2.5 py-1 text-[11px] font-bold rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-300 transition-all">GPS NMEA</button>
      </div>
    </div>

    <!-- Lightbar LED (Indicador XTE / Desvío Lateral) -->
    <div class="flex items-center justify-center gap-1 bg-black/80 px-2 py-1 rounded-lg border border-gray-800/80 shadow-inner">
      <span class="text-[9px] font-black text-gray-400 mr-1">IZQ</span>
      <div id="lightbar" class="flex gap-0.5 sm:gap-1"></div>
      <span class="text-[9px] font-black text-gray-400 ml-1">DER</span>
    </div>
  </header>

  <!-- Panel Principal: Canvas + Controles Flotantes -->
  <div class="relative flex-1 bg-black overflow-hidden w-full h-full">
    
    <!-- Lienzo Canvas 2D -->
    <canvas id="mapCanvas" class="w-full h-full block cursor-crosshair"></canvas>

    <!-- Controles de Zoom en Pantalla (Derecha) -->
    <div class="absolute top-3 right-3 flex flex-col gap-2 z-10">
      <button onclick="zoomIn()" class="w-10 h-10 sm:w-12 sm:h-12 bg-gray-900/90 active:bg-gray-700 border border-gray-700/80 rounded-full flex items-center justify-center text-xl sm:text-2xl font-bold shadow-2xl text-white active:scale-95 transition-transform">+</button>
      <button onclick="zoomOut()" class="w-10 h-10 sm:w-12 sm:h-12 bg-gray-900/90 active:bg-gray-700 border border-gray-700/80 rounded-full flex items-center justify-center text-xl sm:text-2xl font-bold shadow-2xl text-white active:scale-95 transition-transform">-</button>
    </div>

    <!-- Panel de Control Trabajo A-B y Labor (Plegable en Movil) -->
    <div class="absolute top-3 left-3 z-10 max-w-[210px] sm:max-w-xs">
      <!-- Botón Colapsar/Desplegar para Celulares de 5" -->
      <button onclick="toggleControlPanel()" class="bg-gray-900/95 border border-gray-700/80 px-2.5 py-1 rounded-t-xl text-[11px] font-bold text-gray-200 flex items-center gap-1 shadow-md">
        <span>⚙️ Controles A-B</span>
        <span id="panel-toggle-icon" class="text-[9px]">▲</span>
      </button>

      <div id="control-panel-content" class="bg-gray-900/95 backdrop-blur-md border border-gray-800 p-2.5 rounded-b-xl rounded-tr-xl flex flex-col gap-2 shadow-2xl transition-all">
        <!-- Botones A-B -->
        <div class="flex gap-1.5">
          <button id="btn-pointA" onclick="setPointA()" class="flex-1 py-1.5 bg-green-600 hover:bg-green-500 active:bg-green-700 font-bold text-[11px] rounded-lg shadow text-white active:scale-95 transition-all">Punto A</button>
          <button id="btn-pointB" onclick="setPointB()" class="flex-1 py-1.5 bg-red-600 hover:bg-red-500 active:bg-red-700 font-bold text-[11px] rounded-lg shadow text-white active:scale-95 transition-all">Punto B</button>
          <button onclick="clearAB()" class="px-2 py-1.5 bg-gray-800 hover:bg-gray-700 text-[10px] rounded-lg font-bold text-gray-300">Limpiar</button>
        </div>

        <!-- Ancho de Labor + Pintar -->
        <div class="flex items-center justify-between gap-1">
          <label class="text-[11px] text-gray-300 font-medium">Ancho (m):</label>
          <input type="number" id="input-width" value="12.0" step="0.5" min="1" class="w-16 bg-gray-800 border border-gray-700 text-center text-xs p-1 rounded-lg font-bold text-white focus:outline-none focus:border-blue-500" onchange="updateWidth(this.value)">
        </div>

        <button id="btn-paint" onclick="togglePaint()" class="w-full py-1.5 bg-green-600 hover:bg-green-500 font-bold text-xs rounded-lg shadow text-white transition-all active:scale-95">
          Pintar: ON
        </button>
      </div>
    </div>

    <!-- Panel de Métricas Flotante Responsivo (Abajo) -->
    <div class="absolute bottom-3 left-3 right-3 sm:left-3 sm:right-auto bg-gray-900/95 backdrop-blur-md border border-gray-800/90 p-2.5 sm:p-3 rounded-2xl z-10 shadow-2xl">
      <div class="grid grid-cols-4 gap-2 sm:flex sm:gap-5 text-center">
        <div>
          <div class="text-[9px] sm:text-[10px] text-gray-400 font-bold uppercase tracking-wider">Velocidad</div>
          <div class="text-base sm:text-2xl font-black text-yellow-400"><span id="val-speed">0.0</span> <span class="text-[9px] sm:text-xs font-normal">km/h</span></div>
        </div>
        <div class="border-l border-gray-800 pl-2 sm:pl-4">
          <div class="text-[9px] sm:text-[10px] text-gray-400 font-bold uppercase tracking-wider">Desvío</div>
          <div class="text-base sm:text-2xl font-black text-green-400"><span id="val-xte">0.00</span> <span class="text-[9px] sm:text-xs font-normal">m</span></div>
        </div>
        <div class="border-l border-gray-800 pl-2 sm:pl-4">
          <div class="text-[9px] sm:text-[10px] text-gray-400 font-bold uppercase tracking-wider">Área</div>
          <div class="text-base sm:text-2xl font-black text-cyan-400"><span id="val-area">0.00</span> <span class="text-[9px] sm:text-xs font-normal">ha</span></div>
        </div>
        <div class="border-l border-gray-800 pl-2 sm:pl-4">
          <div class="text-[9px] sm:text-[10px] text-gray-400 font-bold uppercase tracking-wider">Pasada</div>
          <div class="text-base sm:text-2xl font-black text-purple-400"><span id="val-pass">0</span></div>
        </div>
      </div>
    </div>

    <!-- Panel Simulador (Esquina Inferior Derecha) -->
    <div id="sim-controls" class="absolute bottom-16 right-3 bg-gray-900/95 backdrop-blur-md border border-gray-800 p-2.5 rounded-2xl flex flex-col gap-1.5 z-10 w-40 sm:w-48 shadow-2xl">
      <div class="text-[10px] font-bold text-gray-400 border-b border-gray-800 pb-1 flex justify-between items-center">
        <span>CONTROLES SIM</span>
        <span class="text-[8px] text-blue-400">TOUCH</span>
      </div>
      <div class="flex items-center justify-between text-[11px]">
        <span>Acelerar:</span>
        <input type="range" id="sim-speed" min="0" max="30" value="10" class="w-20 sm:w-24 accent-blue-500" oninput="simSpeed = parseFloat(this.value)">
      </div>
      <div class="flex items-center justify-between text-[11px]">
        <span>Volante:</span>
        <input type="range" id="sim-steer" min="-45" max="45" value="0" class="w-20 sm:w-24 accent-blue-500" oninput="simSteer = parseFloat(this.value)">
      </div>
    </div>
  </div>

  <script>
    // --- ESTADO GLOBAL ---
    let mode = 'sim';
    let zoomLevel = 3.0;
    let isPainting = true;
    let isPanelOpen = true;

    let posX = 0, posY = 0; 
    let heading = 0; 
    let speedKmH = 0;
    let gpsAccuracy = 0.02;
    let gpsSats = 18;

    let originLat = null, originLon = null;

    let implementWidth = 12.0; 
    let implementOffset = 3.0; 
    let pointA = null, pointB = null;
    let abHeading = null; 

    let swaths = []; 
    let lastBoomBar = null; 
    let totalAreaM2 = 0;

    let simSpeed = 10;
    let simSteer = 0;

    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');

    function init() {
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
      buildLightbar();
      setupTouchControls();
      requestAnimationFrame(gameLoop);
    }

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }

    function toggleControlPanel() {
      isPanelOpen = !isPanelOpen;
      const content = document.getElementById('control-panel-content');
      const icon = document.getElementById('panel-toggle-icon');
      if (isPanelOpen) {
        content.classList.remove('hidden');
        icon.innerText = '▲';
      } else {
        content.classList.add('hidden');
        icon.innerText = '▼';
      }
    }

    function zoomIn() { zoomLevel = Math.min(zoomLevel * 1.25, 15.0); }
    function zoomOut() { zoomLevel = Math.max(zoomLevel / 1.25, 0.5); }

    function updateWidth(val) { 
      implementWidth = parseFloat(val) || 12.0; 
    }

    function togglePaint() {
      isPainting = !isPainting;
      const btn = document.getElementById('btn-paint');
      if (isPainting) {
        btn.className = 'w-full py-1.5 bg-green-600 hover:bg-green-500 font-bold text-xs rounded-lg shadow text-white transition-all active:scale-95';
        btn.innerText = 'Pintar: ON';
      } else {
        btn.className = 'w-full py-1.5 bg-red-600 hover:bg-red-500 font-bold text-xs rounded-lg shadow text-white transition-all active:scale-95';
        btn.innerText = 'Pintar: OFF';
        lastBoomBar = null;
      }
    }

    function setupTouchControls() {
      let lastTouchDist = 0;
      document.addEventListener('touchmove', (e) => {
        if (e.touches.length > 1) e.preventDefault();
      }, { passive: false });

      canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          lastTouchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        }
      }, { passive: false });

      canvas.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2) {
          e.preventDefault();
          const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
          const delta = dist - lastTouchDist;
          if (Math.abs(delta) > 5) {
            if (delta > 0) zoomIn(); else zoomOut();
            lastTouchDist = dist;
          }
        }
      }, { passive: false });

      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        if (e.deltaY < 0) zoomIn(); else zoomOut();
      }, { passive: false });
    }

    function buildLightbar() {
      const container = document.getElementById('lightbar');
      container.innerHTML = '';
      const ledCount = window.innerWidth < 400 ? 11 : 17; 
      const half = Math.floor(ledCount / 2);

      for (let i = -half; i <= half; i++) {
        const led = document.createElement('div');
        led.id = `led-${i}`;
        led.className = 'w-2 sm:w-2.5 h-4 sm:h-5 rounded-sm bg-gray-900 border border-gray-800 transition-colors duration-75';
        container.appendChild(led);
      }
    }

    function updateLightbar(xte) {
      const thresholdStep = 0.15;
      const ledCount = window.innerWidth < 400 ? 11 : 17;
      const half = Math.floor(ledCount / 2);

      for (let i = -half; i <= half; i++) {
        const led = document.getElementById(`led-${i}`);
        if (!led) continue;
        
        if (i === 0) {
          led.className = Math.abs(xte) < 0.1 ? 'w-2 sm:w-2.5 h-4 sm:h-5 rounded-sm bg-green-500 shadow-lg shadow-green-500/50' : 'w-2 sm:w-2.5 h-4 sm:h-5 rounded-sm bg-gray-900';
        } else if (i < 0 && xte < -Math.abs(i) * thresholdStep) {
          led.className = 'w-2 sm:w-2.5 h-4 sm:h-5 rounded-sm bg-red-500 shadow-lg shadow-red-500/50';
        } else if (i > 0 && xte > i * thresholdStep) {
          led.className = 'w-2 sm:w-2.5 h-4 sm:h-5 rounded-sm bg-red-500 shadow-lg shadow-red-500/50';
        } else {
          led.className = 'w-2 sm:w-2.5 h-4 sm:h-5 rounded-sm bg-gray-900';
        }
      }
    }

    function setPointA() { pointA = { x: posX, y: posY }; if (pointB) calculateAB(); }
    function setPointB() { pointB = { x: posX, y: posY }; if (pointA) calculateAB(); }
    function clearAB() { pointA = null; pointB = null; abHeading = null; }

    function calculateAB() {
      const dx = pointB.x - pointA.x;
      const dy = pointB.y - pointA.y;
      abHeading = Math.atan2(dx, dy); 
    }

    let lastTime = performance.now();

    function gameLoop(now) {
      const dt = (now - lastTime) / 1000;
      lastTime = now;

      updatePhysics(dt);
      renderMap();

      requestAnimationFrame(gameLoop);
    }

    function updatePhysics(dt) {
      if (mode === 'sim') {
        speedKmH = simSpeed;
        heading += (simSteer * (speedKmH / 10)) * dt;
        
        const speedMS = speedKmH / 3.6;
        const radHeading = heading * Math.PI / 180;
        posX += Math.sin(radHeading) * speedMS * dt;
        posY += Math.cos(radHeading) * speedMS * dt;
      }

      // --- CÁLCULO GEOMÉTRICO CONTINUO DE PINTADO ---
      const radHeading = heading * Math.PI / 180;
      const implX = posX - Math.sin(radHeading) * implementOffset;
      const implY = posY - Math.cos(radHeading) * implementOffset;

      const perpX = Math.cos(radHeading) * (implementWidth / 2);
      const perpY = -Math.sin(radHeading) * (implementWidth / 2);

      const currentBoomBar = {
        left:  { x: implX - perpX, y: implY - perpY },
        right: { x: implX + perpX, y: implY + perpY },
        center: { x: implX, y: implY }
      };

      if (isPainting && speedKmH > 0.5) {
        if (lastBoomBar) {
          const dist = Math.hypot(implX - lastBoomBar.center.x, implY - lastBoomBar.center.y);

          if (dist >= 0.2) {
            const swath = [
              lastBoomBar.left,
              lastBoomBar.right,
              currentBoomBar.right,
              currentBoomBar.left
            ];

            swaths.push(swath);
            totalAreaM2 += dist * implementWidth;
            lastBoomBar = currentBoomBar;
          }
        } else {
          lastBoomBar = currentBoomBar;
        }
      } else {
        lastBoomBar = null;
      }

      // --- CÁLCULO DE PASADA Y DESVÍO LATERAL (XTE) ---
      let xte = 0;
      let currentPass = 0;

      if (pointA && abHeading !== null) {
        const dx = posX - pointA.x;
        const dy = posY - pointA.y;
        const perpDist = dx * Math.cos(abHeading) - dy * Math.sin(abHeading);
        
        currentPass = Math.round(perpDist / implementWidth);
        xte = perpDist - (currentPass * implementWidth);
      }

      document.getElementById('val-speed').innerText = speedKmH.toFixed(1);
      document.getElementById('val-xte').innerText = Math.abs(xte).toFixed(2);
      document.getElementById('val-area').innerText = (totalAreaM2 / 10000).toFixed(2);
      document.getElementById('val-pass').innerText = currentPass;

      updateLightbar(xte);
      updateGPSStatusUI();
    }

    function updateGPSStatusUI() {
      const statusDiv = document.getElementById('gps-status');
      if (mode === 'sim') {
        statusDiv.className = 'px-2 py-0.5 text-[10px] sm:text-xs rounded-full bg-blue-600 text-white font-bold flex items-center gap-1';
        statusDiv.innerHTML = `<span>Simulador</span> <span class="bg-black/30 px-1 py-0.2 rounded text-[9px]">±${gpsAccuracy}m</span>`;
      } else {
        statusDiv.className = 'px-2 py-0.5 text-[10px] sm:text-xs rounded-full bg-green-600 text-white font-bold flex items-center gap-1';
        statusDiv.innerHTML = `<span>GPS RTK</span> <span class="bg-black/30 px-1 py-0.2 rounded text-[9px]">🛰️ ${gpsSats} | ±${gpsAccuracy.toFixed(2)}m</span>`;
      }
    }

    function renderMap() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;

      ctx.translate(centerX, centerY);
      ctx.scale(zoomLevel, -zoomLevel);
      ctx.translate(-posX, -posY);

      drawGrid();
      drawSwaths();

      if (pointA && abHeading !== null) {
        drawABLines();
      }

      drawTractorAndImplement();

      ctx.restore();
    }

    function drawGrid() {
      ctx.strokeStyle = '#111827';
      ctx.lineWidth = 1 / zoomLevel;
      const gridSize = 50;

      const minX = posX - (canvas.width / (2 * zoomLevel));
      const maxX = posX + (canvas.width / (2 * zoomLevel));
      const minY = posY - (canvas.height / (2 * zoomLevel));
      const maxY = posY + (canvas.height / (2 * zoomLevel));

      const startX = Math.floor(minX / gridSize) * gridSize;
      const startY = Math.floor(minY / gridSize) * gridSize;

      ctx.beginPath();
      for (let x = startX; x < maxX; x += gridSize) {
        ctx.moveTo(x, minY); ctx.lineTo(x, maxY);
      }
      for (let y = startY; y < maxY; y += gridSize) {
        ctx.moveTo(minX, y); ctx.lineTo(maxX, y);
      }
      ctx.stroke();
    }

    function drawSwaths() {
      if (swaths.length === 0) return;

      ctx.fillStyle = 'rgba(34, 197, 94, 0.5)'; 
      for (let i = 0; i < swaths.length; i++) {
        const poly = swaths[i];
        ctx.beginPath();
        ctx.moveTo(poly[0].x, poly[0].y);
        ctx.lineTo(poly[1].x, poly[1].y);
        ctx.lineTo(poly[2].x, poly[2].y);
        ctx.lineTo(poly[3].x, poly[3].y);
        ctx.closePath();
        ctx.fill();
      }
    }

    function drawABLines() {
      const lineLength = 5000; 
      ctx.lineWidth = 1.5 / zoomLevel;

      const dx = posX - pointA.x;
      const dy = posY - pointA.y;
      const perpDist = dx * Math.cos(abHeading) - dy * Math.sin(abHeading);
      const activePassIndex = Math.round(perpDist / implementWidth);

      for (let i = -15; i <= 15; i++) {
        const offset = i * implementWidth;
        const startX = pointA.x + Math.cos(abHeading) * offset - Math.sin(abHeading) * lineLength;
        const startY = pointA.y - Math.sin(abHeading) * offset - Math.cos(abHeading) * lineLength;
        const endX = pointA.x + Math.cos(abHeading) * offset + Math.sin(abHeading) * lineLength;
        const endY = pointA.y - Math.sin(abHeading) * offset + Math.cos(abHeading) * lineLength;

        if (i === activePassIndex) {
          ctx.strokeStyle = '#facc15'; 
          ctx.lineWidth = 3.5 / zoomLevel;
          ctx.shadowColor = '#facc15';
          ctx.shadowBlur = 8;
        } else {
          ctx.strokeStyle = (i === 0) ? '#38bdf8' : 'rgba(255, 255, 255, 0.25)';
          ctx.lineWidth = 1.5 / zoomLevel;
          ctx.shadowBlur = 0;
        }

        if (i === 0) ctx.setLineDash([6 / zoomLevel, 6 / zoomLevel]);
        else ctx.setLineDash([]);

        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(endX, endY);
        ctx.stroke();
      }
      ctx.setLineDash([]);
      ctx.shadowBlur = 0;
    }

    function drawTractorAndImplement() {
      ctx.save();
      ctx.translate(posX, posY);
      ctx.rotate(-heading * Math.PI / 180);

      // Barral de labor trasero amarillo
      ctx.fillStyle = '#eab308';
      ctx.fillRect(-implementWidth / 2, -implementOffset - 0.4, implementWidth, 0.8);

      // Línea de tiro
      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 0.6;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -implementOffset);
      ctx.stroke();

      // Tractor
      ctx.fillStyle = '#3b82f6';
      ctx.beginPath();
      ctx.moveTo(0, 3.2);
      ctx.lineTo(-1.6, -2);
      ctx.lineTo(1.6, -2);
      ctx.closePath();
      ctx.fill();

      // Cabina
      ctx.fillStyle = '#1d4ed8';
      ctx.fillRect(-1, -1, 2, 2);

      ctx.restore();
    }

    function setMode(m) {
      mode = m;
      document.getElementById('sim-controls').style.display = (m === 'sim') ? 'flex' : 'none';
      
      const activeClass = 'shrink-0 px-2.5 py-1 text-[11px] font-bold rounded-lg bg-blue-600 hover:bg-blue-500 text-white shadow transition-all';
      const inactiveClass = 'shrink-0 px-2.5 py-1 text-[11px] font-bold rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-300 transition-all';

      document.getElementById('btn-mode-sim').className = (m === 'sim') ? activeClass : inactiveClass;
      document.getElementById('btn-mode-gps').className = (m === 'gps') ? activeClass : inactiveClass;
      document.getElementById('btn-mode-ext').className = (m === 'ext') ? activeClass : inactiveClass;

      if (m === 'gps') {
        startInternalGPS();
      }
    }

    function startInternalGPS() {
      if ('geolocation' in navigator) {
        navigator.geolocation.watchPosition((pos) => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          speedKmH = (pos.coords.speed || 0) * 3.6;
          gpsAccuracy = pos.coords.accuracy || 1.0;
          gpsSats = 12;

          if (pos.coords.heading !== null && !isNaN(pos.coords.heading)) {
            heading = pos.coords.heading;
          }

          if (originLat === null) {
            originLat = lat;
            originLon = lon;
          }

          posX = (lon - originLon) * (111320 * Math.cos(lat * Math.PI / 180));
          posY = (lat - originLat) * 111320;

        }, (err) => {
          alert("Error al obtener señal GPS: " + err.message);
        }, {
          enableHighAccuracy: true,
          maximumAge: 0
        });
      }
    }

    window.onload = init;
  </script>
