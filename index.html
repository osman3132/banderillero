<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Banderillero Satelital Agrícola Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Previene el zoom nativo del navegador en pantallas táctiles */
    html, body {
      touch-action: manipulation;
      overflow: hidden;
      overscroll-behavior: none;
    }
    canvas {
      touch-action: none; /* Bloquea el zoom y desplazamiento del navegador sobre el Canvas */
    }
  </style>
</head>
<body class="bg-gray-900 text-white select-none h-screen w-screen flex flex-col font-sans">

  <!-- Header / Barra Superior con Barra de Luces (Lightbar) -->
  <header class="bg-gray-800 border-b border-gray-700 p-3 flex flex-col gap-2">
    <div class="flex justify-between items-center">
      <div class="flex items-center gap-2">
        <span class="text-xl font-bold text-green-400">🌾 Banderillero Pro</span>
        <span id="gps-status" class="px-2 py-0.5 text-xs rounded-full bg-red-600 text-white font-semibold">Sin GPS</span>
      </div>
      <div class="flex gap-2">
        <button id="btn-mode-sim" onclick="setMode('sim')" class="px-3 py-1 text-xs font-bold rounded bg-blue-600 hover:bg-blue-500">Simulador</button>
        <button id="btn-mode-gps" onclick="setMode('gps')" class="px-3 py-1 text-xs font-bold rounded bg-gray-700 hover:bg-gray-600">GPS Interno</button>
        <button id="btn-mode-ext" onclick="setMode('ext')" class="px-3 py-1 text-xs font-bold rounded bg-gray-700 hover:bg-gray-600">GPS NMEA/Serial</button>
      </div>
    </div>

    <!-- Lightbar LED (Indicador XTE) -->
    <div class="flex items-center justify-center gap-1 bg-black p-2 rounded-lg border border-gray-700">
      <span class="text-xs text-gray-400 mr-1">IZQ</span>
      <div id="lightbar" class="flex gap-1">
        <!-- Generado dinámicamente -->
      </div>
      <span class="text-xs text-gray-400 ml-1">DER</span>
    </div>
  </header>

  <!-- Panel Principal: Canvas + Métricas -->
  <div class="relative flex-1 bg-black">
    
    <!-- Canvas 2D -->
    <canvas id="mapCanvas" class="w-full h-full block cursor-crosshair"></canvas>

    <!-- Overlay Controles de Zoom en Pantalla -->
    <div class="absolute top-4 right-4 flex flex-col gap-2 z-10">
      <button onclick="zoomIn()" class="w-12 h-12 bg-gray-800 hover:bg-gray-700 active:bg-gray-600 border border-gray-600 rounded-full flex items-center justify-center text-2xl font-bold shadow-lg text-white">+</button>
      <button onclick="zoomOut()" class="w-12 h-12 bg-gray-800 hover:bg-gray-700 active:bg-gray-600 border border-gray-600 rounded-full flex items-center justify-center text-2xl font-bold shadow-lg text-white">-</button>
      <button onclick="recenterMap()" class="w-12 h-12 bg-gray-800 hover:bg-gray-700 active:bg-gray-600 border border-gray-600 rounded-full flex items-center justify-center text-lg shadow-lg text-white">🎯</button>
    </div>

    <!-- Panel de Métricas Flotante -->
    <div class="absolute bottom-4 left-4 right-4 md:left-4 md:right-auto bg-gray-900/90 backdrop-blur border border-gray-700 p-3 rounded-xl flex justify-between md:justify-start gap-4 text-center z-10 shadow-xl">
      <div>
        <div class="text-xs text-gray-400 uppercase">Velocidad</div>
        <div class="text-2xl font-black text-yellow-400"><span id="val-speed">0.0</span> <span class="text-xs">km/h</span></div>
      </div>
      <div class="border-l border-gray-700 pl-4">
        <div class="text-xs text-gray-400 uppercase">Desvío (XTE)</div>
        <div class="text-2xl font-black text-green-400"><span id="val-xte">0.00</span> <span class="text-xs">m</span></div>
      </div>
      <div class="border-l border-gray-700 pl-4">
        <div class="text-xs text-gray-400 uppercase">Área Trab.</div>
        <div class="text-2xl font-black text-cyan-400"><span id="val-area">0.00</span> <span class="text-xs">ha</span></div>
      </div>
      <div class="border-l border-gray-700 pl-4">
        <div class="text-xs text-gray-400 uppercase">Pasada</div>
        <div class="text-2xl font-black text-purple-400"><span id="val-pass">0</span></div>
      </div>
    </div>

    <!-- Panel de Controles A-B y Configuración -->
    <div class="absolute top-4 left-4 flex flex-col gap-2 z-10">
      <div class="bg-gray-900/90 backdrop-blur border border-gray-700 p-2 rounded-lg flex gap-2">
        <button id="btn-pointA" onclick="setPointA()" class="px-3 py-1.5 bg-green-600 hover:bg-green-500 font-bold text-xs rounded shadow">Punto A</button>
        <button id="btn-pointB" onclick="setPointB()" class="px-3 py-1.5 bg-red-600 hover:bg-red-500 font-bold text-xs rounded shadow">Punto B</button>
        <button onclick="clearAB()" class="px-2 py-1.5 bg-gray-700 hover:bg-gray-600 text-xs rounded">Limpiar AB</button>
      </div>

      <div class="bg-gray-900/90 backdrop-blur border border-gray-700 p-2 rounded-lg flex items-center gap-2">
        <label class="text-xs text-gray-300">Ancho (m):</label>
        <input type="number" id="input-width" value="12.0" step="0.5" min="1" class="w-16 bg-gray-800 border border-gray-600 text-center text-xs p-1 rounded text-white font-bold" onchange="updateWidth(this.value)">
      </div>
    </div>

    <!-- Panel Simulador (visible solo en modo sim) -->
    <div id="sim-controls" class="absolute bottom-20 right-4 bg-gray-900/90 backdrop-blur border border-gray-700 p-3 rounded-xl flex flex-col gap-2 z-10 w-48">
      <div class="text-xs font-bold text-gray-400 border-b border-gray-700 pb-1">Controles Simulador</div>
      <div class="flex items-center justify-between">
        <span class="text-xs">Acelerar:</span>
        <input type="range" id="sim-speed" min="0" max="30" value="10" class="w-24" oninput="simSpeed = parseFloat(this.value)">
      </div>
      <div class="flex items-center justify-between">
        <span class="text-xs">Volante:</span>
        <input type="range" id="sim-steer" min="-45" max="45" value="0" class="w-24" oninput="simSteer = parseFloat(this.value)">
      </div>
    </div>
  </div>

  <script>
    // --- ESTADO GLOBAL ---
    let mode = 'sim'; // 'sim', 'gps', 'ext'
    let zoomLevel = 3.0; // Escala de píxeles por metro
    let recenter = true;

    // Posición del vehículo (Coordenadas Locales en Metros para precisión)
    let posX = 0, posY = 0; 
    let heading = 0; // Grados (0 = Norte)
    let speedKmH = 0;

    // Coordenadas GPS Base para convertir Lat/Lon a Metros locales
    let originLat = null, originLon = null;

    // Configuración Agrícola
    let implementWidth = 12.0; // metros
    let pointA = null, pointB = null;
    let abHeading = null;

    // Historial de cobertura (Polígonos/Franjas trabajadas)
    let coveragePath = []; 
    let totalAreaM2 = 0;

    // Simulador
    let simSpeed = 10; // km/h
    let simSteer = 0;  // grados

    // Elementos DOM
    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');

    // --- INICIALIZACIÓN ---
    function init() {
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
      buildLightbar();
      setupTouchControls();
      requestAnimationFrame(gameLoop);
    }

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }

    // --- CONTROLES DE ZOOM Y NAVEGACIÓN ---
    function zoomIn() {
      zoomLevel = Math.min(zoomLevel * 1.25, 15.0);
    }

    function zoomOut() {
      zoomLevel = Math.max(zoomLevel / 1.25, 0.5);
    }

    function recenterMap() {
      recenter = true;
    }

    function updateWidth(val) {
      implementWidth = parseFloat(val) || 12.0;
    }

    // --- PREVENCIÓN DE ZOOM NATIVO DEL NAVEGADOR ---
    function setupTouchControls() {
      let lastTouchDist = 0;

      canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          lastTouchDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
        }
      }, { passive: false });

      canvas.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2) {
          e.preventDefault(); // Evita zoom de la página web
          const dist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          const delta = dist - lastTouchDist;
          if (Math.abs(delta) > 5) {
            if (delta > 0) zoomIn();
            else zoomOut();
            lastTouchDist = dist;
          }
        }
      }, { passive: false });

      // Zoom con la rueda del ratón en la PC
      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        if (e.deltaY < 0) zoomIn();
        else zoomOut();
      }, { passive: false });
    }

    // --- LIGHTBAR LED ---
    function buildLightbar() {
      const container = document.getElementById('lightbar');
      container.innerHTML = '';
      for (let i = -8; i <= 8; i++) {
        const led = document.createElement('div');
        led.id = `led-${i}`;
        led.className = 'w-3 h-6 rounded-sm bg-gray-800 border border-gray-900 transition-colors duration-100';
        container.appendChild(led);
      }
    }

    function updateLightbar(xte) {
      // xte > 0: desviado a la derecha | xte < 0: desviado a la izquierda
      const thresholdStep = 0.15; // 15 cm por LED
      for (let i = -8; i <= 8; i++) {
        const led = document.getElementById(`led-${i}`);
        if (!led) continue;
        
        if (i === 0) {
          led.className = Math.abs(xte) < 0.1 ? 'w-3 h-6 rounded-sm bg-green-500 shadow-lg shadow-green-500/50' : 'w-3 h-6 rounded-sm bg-gray-800';
        } else if (i < 0 && xte < -Math.abs(i) * thresholdStep) {
          led.className = 'w-3 h-6 rounded-sm bg-red-500 shadow-lg shadow-red-500/50';
        } else if (i > 0 && xte > i * thresholdStep) {
          led.className = 'w-3 h-6 rounded-sm bg-red-500 shadow-lg shadow-red-500/50';
        } else {
          led.className = 'w-3 h-6 rounded-sm bg-gray-800';
        }
      }
    }

    // --- CONFIGURACIÓN DE LÍNEA A-B ---
    function setPointA() {
      pointA = { x: posX, y: posY };
      if (pointB) calculateAB();
    }

    function setPointB() {
      pointB = { x: posX, y: posY };
      if (pointA) calculateAB();
    }

    function clearAB() {
      pointA = null;
      pointB = null;
      abHeading = null;
    }

    function calculateAB() {
      const dx = pointB.x - pointA.x;
      const dy = pointB.y - pointA.y;
      abHeading = Math.atan2(dx, dy);
    }

    // --- BUCLE PRINCIPAL DE RENDERIZADO Y FÍSICA ---
    let lastTime = performance.now();

    function gameLoop(now) {
      const dt = (now - lastTime) / 1000;
      lastTime = now;

      updatePhysics(dt);
      renderMap();

      requestAnimationFrame(gameLoop);
    }

    function updatePhysics(dt) {
      if (mode === 'sim') {
        speedKmH = simSpeed;
        heading += (simSteer * (speedKmH / 10)) * dt;
        const speedMS = speedKmH / 3.6;
        const rad = heading * Math.PI / 180;
        
        posX += Math.sin(rad) * speedMS * dt;
        posY += Math.cos(rad) * speedMS * dt;
      }

      // Registrar trayectoria de cobertura si hay movimiento
      if (speedKmH > 0.5) {
        coveragePath.push({ x: posX, y: posY, width: implementWidth });
        totalAreaM2 += (speedKmH / 3.6) * implementWidth * dt;
      }

      // Calcular Cross-Track Error (XTE) respecto a la línea A-B
      let xte = 0;
      let currentPass = 0;

      if (pointA && abHeading !== null) {
        const dx = posX - pointA.x;
        const dy = posY - pointA.y;
        
        // Rotación relativa a la orientación AB
        const perpDist = dx * Math.cos(abHeading) - dy * Math.sin(abHeading);
        
        currentPass = Math.round(perpDist / implementWidth);
        xte = perpDist - (currentPass * implementWidth);
      }

      // Actualizar UI
      document.getElementById('val-speed').innerText = speedKmH.toFixed(1);
      document.getElementById('val-xte').innerText = Math.abs(xte).toFixed(2);
      document.getElementById('val-area').innerText = (totalAreaM2 / 10000).toFixed(2);
      document.getElementById('val-pass').innerText = currentPass;

      updateLightbar(xte);
    }

    // --- RENDERIZADO DEL MAPA ---
    function renderMap() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      // Centro de pantalla
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;

      ctx.translate(centerX, centerY);
      ctx.scale(zoomLevel, -zoomLevel); // Invertir Y para coordenadas cartesianas estándar
      ctx.translate(-posX, -posY);

      // 1. Dibujar Grilla de Campo
      drawGrid();

      // 2. Dibujar Cobertura / Franja Trabajada
      drawCoverage();

      // 3. Dibujar Líneas Paralelas A-B
      if (pointA && abHeading !== null) {
        drawABLines();
      }

      // 4. Dibujar Maquinaria / Tractor
      drawTractor();

      ctx.restore();
    }

    function drawGrid() {
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 1 / zoomLevel;
      const gridSize = 50;

      const minX = posX - (canvas.width / (2 * zoomLevel));
      const maxX = posX + (canvas.width / (2 * zoomLevel));
      const minY = posY - (canvas.height / (2 * zoomLevel));
      const maxY = posY + (canvas.height / (2 * zoomLevel));

      const startX = Math.floor(minX / gridSize) * gridSize;
      const startY = Math.floor(minY / gridSize) * gridSize;

      ctx.beginPath();
      for (let x = startX; x < maxX; x += gridSize) {
        ctx.moveTo(x, minY);
        ctx.lineTo(x, maxY);
      }
      for (let y = startY; y < maxY; y += gridSize) {
        ctx.moveTo(minX, y);
        ctx.lineTo(maxX, y);
      }
      ctx.stroke();
    }

    function drawCoverage() {
      if (coveragePath.length < 2) return;

      ctx.strokeStyle = 'rgba(34, 197, 94, 0.4)'; // Verde Semitransparente
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      for (let i = 1; i < coveragePath.length; i++) {
        const p1 = coveragePath[i - 1];
        const p2 = coveragePath[i];
        ctx.lineWidth = p2.width;

        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      }
    }

    function drawABLines() {
      const lineLength = 2000;
      ctx.lineWidth = 1.5 / zoomLevel;

      // Dibujar pasadas paralelas
      for (let i = -10; i <= 10; i++) {
        const offset = i * implementWidth;
        const startX = pointA.x + Math.cos(abHeading) * offset - Math.sin(abHeading) * lineLength;
        const startY = pointA.y - Math.sin(abHeading) * offset - Math.cos(abHeading) * lineLength;
        const endX = pointA.x + Math.cos(abHeading) * offset + Math.sin(abHeading) * lineLength;
        const endY = pointA.y - Math.sin(abHeading) * offset + Math.cos(abHeading) * lineLength;

        ctx.strokeStyle = (i === 0) ? '#38bdf8' : 'rgba(255, 255, 255, 0.2)';
        if (i === 0) ctx.setLineDash([5 / zoomLevel, 5 / zoomLevel]);
        else ctx.setLineDash([]);

        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(endX, endY);
        ctx.stroke();
      }
      ctx.setLineDash([]);
    }

    function drawTractor() {
      ctx.save();
      ctx.translate(posX, posY);
      ctx.rotate(-heading * Math.PI / 180);

      // Implemento / Barral
      ctx.fillStyle = '#eab308';
      ctx.fillRect(-implementWidth / 2, -0.5, implementWidth, 1);

      // Tractor
      ctx.fillStyle = '#3b82f6';
      ctx.beginPath();
      ctx.moveTo(0, 3);
      ctx.lineTo(-1.5, -2);
      ctx.lineTo(1.5, -2);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    // --- CAMBIO DE MODO GPS / SIMULADOR ---
    function setMode(m) {
      mode = m;
      document.getElementById('sim-controls').style.display = (m === 'sim') ? 'flex' : 'none';
      
      document.getElementById('btn-mode-sim').className = (m === 'sim') ? 'px-3 py-1 text-xs font-bold rounded bg-blue-600' : 'px-3 py-1 text-xs font-bold rounded bg-gray-700';
      document.getElementById('btn-mode-gps').className = (m === 'gps') ? 'px-3 py-1 text-xs font-bold rounded bg-blue-600' : 'px-3 py-1 text-xs font-bold rounded bg-gray-700';
      document.getElementById('btn-mode-ext').className = (m === 'ext') ? 'px-3 py-1 text-xs font-bold rounded bg-blue-600' : 'px-3 py-1 text-xs font-bold rounded bg-gray-700';

      const status = document.getElementById('gps-status');
      if (m === 'sim') {
        status.innerText = 'Simulador Activo';
        status.className = 'px-2 py-0.5 text-xs rounded-full bg-blue-600 text-white font-semibold';
      } else if (m === 'gps') {
        startInternalGPS();
      } else if (m === 'ext') {
        status.innerText = 'Esperando Serial NMEA...';
        status.className = 'px-2 py-0.5 text-xs rounded-full bg-yellow-600 text-white font-semibold';
      }
    }

    function startInternalGPS() {
      const status = document.getElementById('gps-status');
      if ('geolocation' in navigator) {
        navigator.geolocation.watchPosition((pos) => {
          status.innerText = 'GPS Conectado';
          status.className = 'px-2 py-0.5 text-xs rounded-full bg-green-600 text-white font-semibold';

          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          speedKmH = (pos.coords.speed || 0) * 3.6;
          if (pos.coords.heading !== null && !isNaN(pos.coords.heading)) {
            heading = pos.coords.heading;
          }

          if (originLat === null) {
            originLat = lat;
            originLon = lon;
          }

          // Conversión simplificada Lat/Lon a Metros Locales
          posX = (lon - originLon) * (111320 * Math.cos(lat * Math.PI / 180));
          posY = (lat - originLat) * 111320;

        }, (err) => {
          status.innerText = 'Error GPS';
          status.className = 'px-2 py-0.5 text-xs rounded-full bg-red-600 text-white font-semibold';
        }, {
          enableHighAccuracy: true,
          maximumAge: 0
        });
      }
    }

    window.onload = init;
  </script>
</body>
</html>
