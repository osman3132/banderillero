<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Banderillero Satelital Agrícola Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Inmovilizar viewport global para evitar zoom/pan nativo de la página */
    html, body {
      touch-action: none;
      overflow: hidden;
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }
    canvas {
      touch-action: none;
    }
  </style>
</head>
<body class="bg-gray-950 text-white flex flex-col font-sans h-screen w-screen overflow-hidden">

  <!-- Header / Lightbar & Conectividad GPS -->
  <header class="bg-gray-900 border-b border-gray-800 px-3 py-2 flex flex-col gap-1.5 shrink-0 shadow-lg">
    <div class="flex justify-between items-center flex-wrap gap-2">
      <div class="flex items-center gap-2">
        <span class="text-lg font-extrabold text-green-400 tracking-wider flex items-center gap-1">
          <span>🌾</span> BANDERILLERO <span class="text-xs bg-green-950 text-green-400 px-1.5 py-0.5 rounded border border-green-800">PRO</span>
        </span>
        <span id="gps-status" class="px-2.5 py-0.5 text-xs rounded-full bg-blue-600 text-white font-semibold shadow">Simulador Activo</span>
      </div>
      <div class="flex gap-1.5">
        <button id="btn-mode-sim" onclick="setMode('sim')" class="px-3 py-1 text-xs font-bold rounded bg-blue-600 hover:bg-blue-500 shadow transition-colors">Simulador</button>
        <button id="btn-mode-gps" onclick="setMode('gps')" class="px-3 py-1 text-xs font-bold rounded bg-gray-800 hover:bg-gray-700 shadow transition-colors">GPS Interno</button>
        <button id="btn-mode-ext" onclick="setMode('ext')" class="px-3 py-1 text-xs font-bold rounded bg-gray-800 hover:bg-gray-700 shadow transition-colors">NMEA / Serial</button>
      </div>
    </div>

    <!-- Lightbar LED (Indicador XTE / Desvío Lateral) -->
    <div class="flex items-center justify-center gap-1 bg-black/90 px-3 py-1.5 rounded-lg border border-gray-800 shadow-inner">
      <span class="text-[10px] font-bold text-gray-400 mr-2">IZQ</span>
      <div id="lightbar" class="flex gap-1 sm:gap-1.5"></div>
      <span class="text-[10px] font-bold text-gray-400 ml-2">DER</span>
    </div>
  </header>

  <!-- Contenedor Principal del Mapa -->
  <div class="relative flex-1 bg-black overflow-hidden">
    
    <!-- Canvas del Banderillero -->
    <canvas id="mapCanvas" class="w-full h-full block cursor-crosshair"></canvas>

    <!-- Panel de Navegación / Zoom (Derecha) -->
    <div class="absolute top-4 right-4 flex flex-col gap-2 z-20">
      <button onclick="zoomIn()" class="w-12 h-12 bg-gray-900/90 hover:bg-gray-800 active:bg-gray-700 border border-gray-700 rounded-xl flex items-center justify-center text-2xl font-bold shadow-xl text-white transition-all">+</button>
      <button onclick="zoomOut()" class="w-12 h-12 bg-gray-900/90 hover:bg-gray-800 active:bg-gray-700 border border-gray-700 rounded-xl flex items-center justify-center text-2xl font-bold shadow-xl text-white transition-all">-</button>
      <button onclick="recenterMap()" class="w-12 h-12 bg-gray-900/90 hover:bg-gray-800 active:bg-gray-700 border border-gray-700 rounded-xl flex items-center justify-center text-xl shadow-xl text-white transition-all">🎯</button>
    </div>

    <!-- Panel Flotante de Configuración Agrícola y Líneas A-B (Izquierda) -->
    <div class="absolute top-4 left-4 flex flex-col gap-2 z-20 max-w-[calc(100vw-5rem)] sm:max-w-xs">
      <!-- Botones Puntos A y B -->
      <div class="bg-gray-900/95 backdrop-blur border border-gray-800 p-2 rounded-xl flex gap-1.5 shadow-2xl">
        <button id="btn-pointA" onclick="setPointA()" class="flex-1 py-1.5 bg-green-600 hover:bg-green-500 active:bg-green-700 font-bold text-xs rounded-lg shadow text-white transition-colors">PUNTO A</button>
        <button id="btn-pointB" onclick="setPointB()" class="flex-1 py-1.5 bg-red-600 hover:bg-red-500 active:bg-red-700 font-bold text-xs rounded-lg shadow text-white transition-colors">PUNTO B</button>
        <button onclick="clearAB()" class="px-2.5 py-1.5 bg-gray-800 hover:bg-gray-700 text-xs font-semibold rounded-lg text-gray-300 transition-colors">Limpiar</button>
      </div>

      <!-- Parámetros de Trabajo y Botón Pintar -->
      <div class="bg-gray-900/95 backdrop-blur border border-gray-800 p-2.5 rounded-xl flex flex-col gap-2 shadow-2xl">
        <div class="flex items-center justify-between gap-2">
          <label class="text-xs text-gray-300 font-medium">Ancho Labor (m):</label>
          <input type="number" id="input-width" value="12.0" step="0.5" min="1" class="w-20 bg-gray-950 border border-gray-700 text-center text-xs p-1 rounded-lg text-green-400 font-bold focus:outline-none focus:border-green-500" onchange="updateWidth(this.value)">
        </div>
        <div class="flex items-center justify-between gap-2">
          <label class="text-xs text-gray-300 font-medium">Offset Trasero (m):</label>
          <input type="number" id="input-offset" value="3.0" step="0.5" min="0" class="w-20 bg-gray-950 border border-gray-700 text-center text-xs p-1 rounded-lg text-yellow-400 font-bold focus:outline-none focus:border-yellow-500" onchange="updateOffset(this.value)">
        </div>

        <!-- Botón de Cobertura / Pintar -->
        <button id="btn-paint" onclick="togglePaint()" class="w-full mt-1 py-2 bg-green-600 hover:bg-green-500 font-extrabold text-xs tracking-wider rounded-lg shadow-lg text-white transition-all flex items-center justify-center gap-1.5">
          <span class="w-2.5 h-2.5 rounded-full bg-white animate-pulse"></span>
          <span>PINTAR: ON</span>
        </button>
      </div>
    </div>

    <!-- Panel Flotante de Métricas Principales (Parte Inferior) -->
    <div class="absolute bottom-4 left-4 right-4 md:left-4 md:right-auto bg-gray-900/95 backdrop-blur border border-gray-800 p-3 rounded-2xl flex justify-between md:justify-start gap-4 text-center z-20 shadow-2xl">
      <div>
        <div class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Velocidad</div>
        <div class="text-2xl sm:text-3xl font-black text-yellow-400 font-mono"><span id="val-speed">0.0</span> <span class="text-xs font-normal text-gray-400">km/h</span></div>
      </div>
      <div class="border-l border-gray-800 pl-4">
        <div class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Desvío (XTE)</div>
        <div class="text-2xl sm:text-3xl font-black text-green-400 font-mono"><span id="val-xte">0.00</span> <span class="text-xs font-normal text-gray-400">m</span></div>
      </div>
      <div class="border-l border-gray-800 pl-4">
        <div class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Superficie</div>
        <div class="text-2xl sm:text-3xl font-black text-cyan-400 font-mono"><span id="val-area">0.00</span> <span class="text-xs font-normal text-gray-400">ha</span></div>
      </div>
      <div class="border-l border-gray-800 pl-4">
        <div class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Pasada</div>
        <div class="text-2xl sm:text-3xl font-black text-purple-400 font-mono"><span id="val-pass">0</span></div>
      </div>
    </div>

    <!-- Panel Controles del Simulador (Abajo Derecha) -->
    <div id="sim-controls" class="absolute bottom-24 right-4 bg-gray-900/95 backdrop-blur border border-gray-800 p-3 rounded-2xl flex flex-col gap-2 z-20 w-48 shadow-2xl">
      <div class="text-[11px] font-extrabold text-gray-400 border-b border-gray-800 pb-1 uppercase tracking-wider flex justify-between items-center">
        <span>Simulador Tractor</span>
        <span class="w-2 h-2 rounded-full bg-blue-500 animate-ping"></span>
      </div>
      <div class="flex items-center justify-between gap-2">
        <span class="text-xs font-medium text-gray-300">Acelerar:</span>
        <input type="range" id="sim-speed" min="0" max="28" value="12" class="w-24 accent-blue-500 cursor-pointer" oninput="simSpeed = parseFloat(this.value)">
      </div>
      <div class="flex items-center justify-between gap-2">
        <span class="text-xs font-medium text-gray-300">Volante:</span>
        <input type="range" id="sim-steer" min="-40" max="40" value="0" class="w-24 accent-blue-500 cursor-pointer" oninput="simSteer = parseFloat(this.value)">
      </div>
      <button onclick="resetSimDirection()" class="text-[10px] bg-gray-800 hover:bg-gray-700 py-1 rounded text-gray-300 font-bold mt-0.5">Enderezar Volante</button>
    </div>

  </div>

  <script>
    // --- ESTADO GLOBAL Y CONFIGURACIÓN ---
    let mode = 'sim'; 
    let zoomLevel = 3.5; // Escala (píxeles por metro)
    let isPainting = true; // Interruptor ON/OFF de aplicación
    let autoRecenter = true;

    // Posición y orientación del Tractor (Coordenadas geodésicas cartesianas en metros)
    let posX = 0, posY = 0; 
    let headingRad = 0; // Ángulo de dirección en radianes (0 = Norte / +Y, Math.PI/2 = Este / +X)
    let speedKmH = 0;

    // Conversión GPS Geodésico
    let originLat = null, originLon = null;

    // Configuración Agrícola
    let implementWidth = 12.0;  // Ancho de la barra de trabajo (m)
    let implementOffset = 3.0;  // Distancia hacia atrás desde la antena GPS al implemento (m)
    
    // Configuración Líneas Paralelas A-B
    let pointA = null;
    let pointB = null;
    let abHeadingRad = null;    // Rumbo exacto de la línea A-B en radianes
    let abUnitX = 0, abUnitY = 0; // Vector unitario director de A->B
    let perpUnitX = 0, perpUnitY = 0; // Vector unitario perpendicular (derecha)

    // Almacenamiento de Cuadriláteros / Rectángulos de Cobertura
    // Estructura de cada elemento: { p1: {x,y}, p2: {x,y}, p3: {x,y}, p4: {x,y} }
    let swaths = []; 
    let lastSwathLeft = null;
    let lastSwathRight = null;
    let totalAreaM2 = 0;

    // Variables Simulador
    let simSpeed = 12; // km/h
    let simSteer = 0;  // grados

    // Elementos DOM
    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');

    // --- INICIALIZACIÓN DE LA APLICACIÓN ---
    function init() {
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
      buildLightbar();
      setupTouchEvents();
      requestAnimationFrame(gameLoop);
    }

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }

    function resetSimDirection() {
      simSteer = 0;
      document.getElementById('sim-steer').value = 0;
    }

    // --- CONTROLES Y PARÁMETROS ---
    function zoomIn() { zoomLevel = Math.min(zoomLevel * 1.25, 20.0); }
    function zoomOut() { zoomLevel = Math.max(zoomLevel / 1.25, 0.4); }
    function recenterMap() { autoRecenter = true; }
    function updateWidth(val) { implementWidth = Math.max(parseFloat(val) || 12.0, 0.5); }
    function updateOffset(val) { implementOffset = Math.max(parseFloat(val) || 0.0, 0.0); }

    function togglePaint() {
      isPainting = !isPainting;
      const btn = document.getElementById('btn-paint');
      if (isPainting) {
        btn.className = 'w-full mt-1 py-2 bg-green-600 hover:bg-green-500 font-extrabold text-xs tracking-wider rounded-lg shadow-lg text-white transition-all flex items-center justify-center gap-1.5';
        btn.innerHTML = '<span class="w-2.5 h-2.5 rounded-full bg-white animate-pulse"></span><span>PINTAR: ON</span>';
      } else {
        btn.className = 'w-full mt-1 py-2 bg-red-600 hover:bg-red-500 font-extrabold text-xs tracking-wider rounded-lg shadow-lg text-white transition-all flex items-center justify-center gap-1.5';
        btn.innerHTML = '<span class="w-2.5 h-2.5 rounded-full bg-gray-400"></span><span>PINTAR: OFF</span>';
        lastSwathLeft = null;
        lastSwathRight = null;
      }
    }

    // --- BLOQUEO DE ZOOM GLOBAL DEL NAVEGADOR Y MULTITÁCTIL ---
    function setupTouchEvents() {
      let initialPinchDist = 0;

      document.addEventListener('touchmove', (e) => {
        if (e.touches.length > 1) e.preventDefault();
      }, { passive: false });

      canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          initialPinchDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
        }
      }, { passive: false });

      canvas.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2) {
          e.preventDefault();
          const currentDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          const diff = currentDist - initialPinchDist;
          if (Math.abs(diff) > 4) {
            if (diff > 0) zoomIn(); else zoomOut();
            initialPinchDist = currentDist;
          }
        }
      }, { passive: false });

      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        if (e.deltaY < 0) zoomIn(); else zoomOut();
      }, { passive: false });
    }

    // --- CONSTRUCCIÓN E INTEGRACIÓN DE LIGHTBAR LED ---
    function buildLightbar() {
      const container = document.getElementById('lightbar');
      container.innerHTML = '';
      for (let i = -8; i <= 8; i++) {
        const led = document.createElement('div');
        led.id = `led-${i}`;
        led.className = 'w-2.5 sm:w-3 h-5 sm:h-6 rounded-sm bg-gray-900 border border-gray-800 transition-colors duration-75';
        container.appendChild(led);
      }
    }

    function updateLightbar(xte) {
      const step = 0.15; // 15 cm por cada segmento LED
      for (let i = -8; i <= 8; i++) {
        const led = document.getElementById(`led-${i}`);
        if (!led) continue;
        
        if (i === 0) {
          led.className = Math.abs(xte) < 0.1 ? 'w-2.5 sm:w-3 h-5 sm:h-6 rounded-sm bg-green-500 shadow-lg shadow-green-500/50 border border-green-400' : 'w-2.5 sm:w-3 h-5 sm:h-6 rounded-sm bg-gray-900 border border-gray-800';
        } else if (i < 0 && xte < -Math.abs(i) * step) {
          led.className = 'w-2.5 sm:w-3 h-5 sm:h-6 rounded-sm bg-red-500 shadow-lg shadow-red-500/50 border border-red-400';
        } else if (i > 0 && xte > i * step) {
          led.className = 'w-2.5 sm:w-3 h-5 sm:h-6 rounded-sm bg-red-500 shadow-lg shadow-red-500/50 border border-red-400';
        } else {
          led.className = 'w-2.5 sm:w-3 h-5 sm:h-6 rounded-sm bg-gray-900 border border-gray-800';
        }
      }
    }

    // --- PUNTOS Y LÍNEAS DE GUIADO A-B PARALELAS INFINITAS ---
    function setPointA() {
      pointA = { x: posX, y: posY };
      document.getElementById('btn-pointA').classList.add('ring-2', 'ring-white');
      if (pointB) calculateABGeometry();
    }

    function setPointB() {
      pointB = { x: posX, y: posY };
      document.getElementById('btn-pointB').classList.add('ring-2', 'ring-white');
      if (pointA) calculateABGeometry();
    }

    function clearAB() {
      pointA = null;
      pointB = null;
      abHeadingRad = null;
      document.getElementById('btn-pointA').classList.remove('ring-2', 'ring-white');
      document.getElementById('btn-pointB').classList.remove('ring-2', 'ring-white');
    }

    function calculateABGeometry() {
      const dx = pointB.x - pointA.x;
      const dy = pointB.y - pointA.y;
      const len = Math.hypot(dx, dy);

      if (len < 1.0) {
        alert("Los Puntos A y B deben estar separados por al menos 1 metro.");
        return;
      }

      abHeadingRad = Math.atan2(dx, dy); // Rumbo de la línea A-B
      abUnitX = dx / len;
      abUnitY = dy / len;

      // Vector Perpendicular hacia la derecha (+90 grados)
      perpUnitX = abUnitY;
      perpUnitY = -abUnitX;
    }

    // --- BUCLE DE SIMULACIÓN Y ANIMACIÓN ---
    let lastTimestamp = performance.now();

    function gameLoop(now) {
      const dt = Math.min((now - lastTimestamp) / 1000, 0.1);
      lastTimestamp = now;

      updatePhysics(dt);
      renderMap();

      requestAnimationFrame(gameLoop);
    }

    // --- FÍSICA Y GEOMETRÍA DE PINTADO SWATH EN LÍNEA RECTA ---
    function updatePhysics(dt) {
      if (mode === 'sim') {
        speedKmH = simSpeed;
        const steerRad = (simSteer * Math.PI / 180) * (speedKmH / 12.0) * dt;
        headingRad += steerRad;

        const speedMS = speedKmH / 3.6;
        posX += Math.sin(headingRad) * speedMS * dt;
        posY += Math.cos(headingRad) * speedMS * dt;
      }

      // 1. Calcular la posición exacta de la Antena GPS y del Barral/Implemento Trasero
      const dirX = Math.sin(headingRad);
      const dirY = Math.cos(headingRad);

      // Posición del Implemento con el Offset Trasero
      const implX = posX - dirX * implementOffset;
      const implY = posY - dirY * implementOffset;

      // Vector Perpendicular al Implemento (extremos de la barra de aplicación)
      const implPerpX = dirY;  // Perpendicular X
      const implPerpY = -dirX; // Perpendicular Y

      const halfWidth = implementWidth / 2.0;

      // Puntos actuales del extremo izquierdo y derecho de la barra
      const currentLeft = {
        x: implX - implPerpX * halfWidth,
        y: implY - implPerpY * halfWidth
      };
      const currentRight = {
        x: implX + implPerpX * halfWidth,
        y: implY + implPerpY * halfWidth
      };

      // 2. Generación de Swaths (Polígonos/Rectángulos Exactos de Cobertura)
      if (isPainting && speedKmH > 0.2) {
        if (lastSwathLeft && lastSwathRight) {
          // Calcular área del cuadrilátero generado
          const distMoved = Math.hypot(implX - (lastSwathLeft.x + lastSwathRight.x)/2, implY - (lastSwathLeft.y + lastSwathRight.y)/2);
          
          if (distMoved >= 0.2) { // Guardar polígono cada 20cm de avance para precisión máxima
            swaths.push({
              p1: { x: lastSwathLeft.x, y: lastSwathLeft.y },
              p2: { x: lastSwathRight.x, y: lastSwathRight.y },
              p3: { x: currentRight.x, y: currentRight.y },
              p4: { x: currentLeft.x, y: currentLeft.y }
            });

            totalAreaM2 += distMoved * implementWidth;

            lastSwathLeft = currentLeft;
            lastSwathRight = currentRight;
          }
        } else {
          lastSwathLeft = currentLeft;
          lastSwathRight = currentRight;
        }
      } else {
        lastSwathLeft = null;
        lastSwathRight = null;
      }

      // 3. Cálculo de Cross-Track Error (XTE) y Pasada Relativa a la Línea A-B
      let xte = 0;
      let currentPass = 0;

      if (pointA && abHeadingRad !== null) {
        // Vector desde Punto A hasta la Antena del Tractor
        const vX = posX - pointA.x;
        const vY = posY - pointA.y;

        // Proyección sobre el vector perpendicular a la línea A-B
        const perpDist = vX * perpUnitX + vY * perpUnitY;

        currentPass = Math.round(perpDist / implementWidth);
        xte = perpDist - (currentPass * implementWidth);
      }

      // Actualizar Métricas en pantalla
      document.getElementById('val-speed').innerText = speedKmH.toFixed(1);
      document.getElementById('val-xte').innerText = Math.abs(xte).toFixed(2);
      document.getElementById('val-area').innerText = (totalAreaM2 / 10000).toFixed(2);
      document.getElementById('val-pass').innerText = currentPass;

      updateLightbar(xte);
    }

    // --- RENDERIZADO GRÁFICO 2D EN CANVAS ---
    function renderMap() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;

      // Mover el origen al centro del canvas y aplicar zoom/escala (invertir Y para coordenadas estándar)
      ctx.translate(centerX, centerY);
      ctx.scale(zoomLevel, -zoomLevel);
      ctx.translate(-posX, -posY);

      drawGrid();
      drawSwathPolygons();

      if (pointA && abHeadingRad !== null) {
        drawABParallelLines();
      }

      drawTractorAndImplement();

      ctx.restore();
    }

    // Dibuja la cuadrícula topográfica del lote
    function drawGrid() {
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 1 / zoomLevel;
      const gridSize = 25; // Rejilla de 25 metros

      const viewWidth = canvas.width / zoomLevel;
      const viewHeight = canvas.height / zoomLevel;

      const minX = Math.floor((posX - viewWidth) / gridSize) * gridSize;
      const maxX = Math.ceil((posX + viewWidth) / gridSize) * gridSize;
      const minY = Math.floor((posY - viewHeight) / gridSize) * gridSize;
      const maxY = Math.ceil((posY + viewHeight) / gridSize) * gridSize;

      ctx.beginPath();
      for (let x = minX; x <= maxX; x += gridSize) {
        ctx.moveTo(x, minY); ctx.lineTo(x, maxY);
      }
      for (let y = minY; y <= maxY; y += gridSize) {
        ctx.moveTo(minX, y); ctx.lineTo(maxX, y);
      }
      ctx.stroke();
    }

    // Dibuja los Polígonos Exactos de Cobertura Aplicada (Swaths)
    function drawSwathPolygons() {
      if (swaths.length === 0) return;

      ctx.fillStyle = 'rgba(34, 197, 94, 0.45)';
      ctx.strokeStyle = 'rgba(34, 197, 94, 0.6)';
      ctx.lineWidth = 0.2 / zoomLevel;

      ctx.beginPath();
      for (let i = 0; i < swaths.length; i++) {
        const s = swaths[i];
        ctx.moveTo(s.p1.x, s.p1.y);
        ctx.lineTo(s.p2.x, s.p2.y);
        ctx.lineTo(s.p3.x, s.p3.y);
        ctx.lineTo(s.p4.x, s.p4.y);
        ctx.closePath();
      }
      ctx.fill();
      ctx.stroke();
    }

    // Dibuja las líneas rectas paralelas infinitas de guiado A-B
    function drawABParallelLines() {
      const lineExtent = 5000; // 5 km de extensión de guía
      ctx.lineWidth = 1.2 / zoomLevel;

      // Rango de pasadas visibles en el área actual
      const numLines = 30;

      for (let i = -numLines; i <= numLines; i++) {
        const offset = i * implementWidth;

        // Centro de la pasada i
        const lineCenterX = pointA.x + perpUnitX * offset;
        const lineCenterY = pointA.y + perpUnitY * offset;

        // Extremos de la línea recta paralela infinita
        const x1 = lineCenterX - abUnitX * lineExtent;
        const y1 = lineCenterY - abUnitY * lineExtent;
        const x2 = lineCenterX + abUnitX * lineExtent;
        const y2 = lineCenterY + abUnitY * lineExtent;

        if (i === 0) {
          ctx.strokeStyle = '#38bdf8'; // Línea Maestra A-B Azul Celeste
          ctx.setLineDash([8 / zoomLevel, 4 / zoomLevel]);
        } else {
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)'; // Pasadas Paralelas
          ctx.setLineDash([]);
        }

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }
      ctx.setLineDash([]);

      // Dibujar marcadores para Punto A y Punto B
      if (pointA) {
        ctx.fillStyle = '#22c55e';
        ctx.beginPath(); ctx.arc(pointA.x, pointA.y, 1.5 / Math.sqrt(zoomLevel), 0, Math.PI * 2); ctx.fill();
      }
      if (pointB) {
        ctx.fillStyle = '#ef4444';
        ctx.beginPath(); ctx.arc(pointB.x, pointB.y, 1.5 / Math.sqrt(zoomLevel), 0, Math.PI * 2); ctx.fill();
      }
    }

    // Dibuja el Tractor y el Implemento de Aplicación
    function drawTractorAndImplement() {
      ctx.save();
      ctx.translate(posX, posY);
      ctx.rotate(headingRad);

      // 1. DIBUJAR IMPLEMENTO TRASERO (BARRA DE APLICACIÓN)
      ctx.save();
      ctx.translate(0, -implementOffset);

      // Barra del Implemento
      ctx.strokeStyle = isPainting ? '#22c55e' : '#ef4444';
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(-implementWidth / 2, 0);
      ctx.lineTo(implementWidth / 2, 0);
      ctx.stroke();

      // Picos / Extremos
      ctx.fillStyle = '#eab308';
      ctx.fillRect(-implementWidth / 2 - 0.2, -0.3, 0.4, 0.6);
      ctx.fillRect(implementWidth / 2 - 0.2, -0.3, 0.4, 0.6);
      ctx.restore();

      // Enganche / Lanaza de tiro
      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 0.3;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -implementOffset);
      ctx.stroke();

      // 2. DIBUJAR TRACTOR
      // Chasis Verde
      ctx.fillStyle = '#15803d';
      ctx.beginPath();
      ctx.roundRect(-1.2, -1.8, 2.4, 3.8, 0.4);
      ctx.fill();
      ctx.strokeStyle = '#22c55e';
      ctx.lineWidth = 0.2;
      ctx.stroke();

      // Cabina Cristal
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.roundRect(-0.9, -0.8, 1.8, 1.6, 0.3);
      ctx.fill();

      // Ruedas Delanteras y Traseras
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(-1.4, 0.8, 0.4, 1.0);  // Delantera Izq
      ctx.fillRect(1.0, 0.8, 0.4, 1.0);   // Delantera Der
      ctx.fillRect(-1.5, -1.6, 0.5, 1.4);  // Trasera Izq
      ctx.fillRect(1.0, -1.6, 0.5, 1.4);   // Trasera Der

      // Antena GPS (Punto Central)
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.arc(0, 0, 0.4, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // --- MODOS GPS / SIMULADOR ---
    function setMode(m) {
      mode = m;
      document.getElementById('sim-controls').style.display = (m === 'sim') ? 'flex' : 'none';
      
      document.getElementById('btn-mode-sim').className = (m === 'sim') ? 'px-3 py-1 text-xs font-bold rounded bg-blue-600 shadow' : 'px-3 py-1 text-xs font-bold rounded bg-gray-800 text-gray-400';
      document.getElementById('btn-mode-gps').className = (m === 'gps') ? 'px-3 py-1 text-xs font-bold rounded bg-blue-600 shadow' : 'px-3 py-1 text-xs font-bold rounded bg-gray-800 text-gray-400';
      document.getElementById('btn-mode-ext').className = (m === 'ext') ? 'px-3 py-1 text-xs font-bold rounded bg-blue-600 shadow' : 'px-3 py-1 text-xs font-bold rounded bg-gray-800 text-gray-400';

      const status = document.getElementById('gps-status');
      if (m === 'sim') {
        status.innerText = 'Simulador Activo';
        status.className = 'px-2.5 py-0.5 text-xs rounded-full bg-blue-600 text-white font-semibold shadow';
      } else if (m === 'gps') {
        startInternalGPS();
      } else if (m === 'ext') {
        status.innerText = 'Esperando NMEA...';
        status.className = 'px-2.5 py-0.5 text-xs rounded-full bg-yellow-600 text-white font-semibold shadow';
      }
    }

    // Geodesia plana: Conversión Lat/Lon a Metros cartesianos ($X,Y$)
    function startInternalGPS() {
      const status = document.getElementById('gps-status');
      if ('geolocation' in navigator) {
        navigator.geolocation.watchPosition((pos) => {
          status.innerText = 'GPS Conectado';
          status.className = 'px-2.5 py-0.5 text-xs rounded-full bg-green-600 text-white font-semibold shadow';

          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          speedKmH = (pos.coords.speed || 0) * 3.6;

          if (pos.coords.heading !== null && !isNaN(pos.coords.heading)) {
            headingRad = pos.coords.heading * Math.PI / 180;
          }

          if (originLat === null) {
            originLat = lat;
            originLon = lon;
          }

          // Proyección plana geodésica local
          posX = (lon - originLon) * (111320 * Math.cos(lat * Math.PI / 180));
          posY = (lat - originLat) * 111320;

        }, (err) => {
          status.innerText = 'Error GPS';
          status.className = 'px-2.5 py-0.5 text-xs rounded-full bg-red-600 text-white font-semibold shadow';
        }, { enableHighAccuracy: true, maximumAge: 0 });
      }
    }

    window.onload = init;
  </script>
</body>
